<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stone-Papper-Scissor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2 style="font-size: 30px;">Stone-Papper-Scissor</h2>
    <div>
        <button onclick="
        playergame('rock');
        " class="js-btn"><img src="images/rock-emoji.png" class="js-img"></button>
        <button onclick="
        playergame('paper');
            " class="js-btn"><img src="images/paper-emoji.png" class="js-img"></button>

        <button onclick="
        playergame('scissors');
            " class="js-btn"><img src="images/scissors-emoji.png" class="js-img"></button>
        <p class="js-result"></p>
        <p class="js-moves"></p>
        <p class="js-score"></p>

        <button class="js-re" onclick="score.wins=0;
        score.loss=0;
        score.tie=0;
        document.querySelector('.js-score').innerHTML=`Wins : ${score.wins} Loss : ${score.loss} Tie : ${score.tie}`;
        localStorage.removeItem('score');
        `Wins : ${score.wins} Loss : ${score.loss} Tie : ${score.tie}`;
        ">Reset Score</button>
    </div>
    <script src="script/script.js"></script>
</body>
</html>
